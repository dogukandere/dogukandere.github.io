<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DoDe Games</title>
<style>
  :root { --text: #1d2430; --muted: #5a6577; --line: #dde3ea; --accent: #1f6fb2; --bg: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --text: #e6ebf2; --muted: #9aa6b8; --line: #2c3542; --accent: #6cb2ee; --bg: #12161c; }
  }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: 1.8rem; margin: 0 0 4px; }
  .meta { color: var(--muted); margin: 0 0 32px; }
  .game { border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .game + .game { margin-top: 16px; }
  .game h2 { font-size: 1.2rem; margin: 0 0 6px; }
  .game p { margin: 0 0 12px; color: var(--muted); }
  a { color: var(--accent); }
  footer { margin-top: 40px; color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <h1>DoDe Games</h1>
  <p class="meta">Mobile games by Doğukan Dere</p>

  <section class="game">
    <h2>Car Parking Route</h2>
    <p>Park cars through tight lots, ramps, garages and night levels.</p>
    <a href="car-parking-route/privacy-policy.html">Privacy Policy / Gizlilik Politikası</a>
  </section>

  <section class="game">
    <h2>Quizzio</h2>
    <p>A quiz game that works offline.</p>
    <a href="quizzio-privacy-policy/">Privacy Policy</a>
  </section>

  <footer>Contact: <a href="mailto:dooogukan@gmail.com">dooogukan@gmail.com</a></footer>
</main>
</body>
</html>
